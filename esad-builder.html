<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>eSAD Item Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="tariff-data.js"></script>
<style>
:root{
  color-scheme:light;
  --ground:#F2F4F1;--surface:#FFFFFF;--sunk:#EBEFEA;--ink:#16201B;--ink-2:#46534C;--ink-3:#6F7C75;--line:#D4DBD6;
  --accent:#1D6B4F;--accent-ink:#FFFFFF;--accent-soft:#DAEEE4;
  --amber:#8A5200;--amber-soft:#FAEACF;--red:#B3261E;--red-soft:#FBE2DF;--blue:#2A5DA8;--blue-soft:#E0E9F7;
  --xml-tag:#1D6B4F;--new-row:#E6F2EC;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#0E1311;--surface:#151C19;--sunk:#1C2521;--ink:#E3EAE6;--ink-2:#ACB9B2;--ink-3:#85928B;--line:#2A3530;
  --accent:#55BB8E;--accent-ink:#06120C;--accent-soft:#163A2B;
  --amber:#E6A94B;--amber-soft:#3A2A10;--red:#EF7B71;--red-soft:#3C1916;--blue:#88AAE8;--blue-soft:#17243A;
  --xml-tag:#6FCB9F;--new-row:#15291F;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E1311;--surface:#151C19;--sunk:#1C2521;--ink:#E3EAE6;--ink-2:#ACB9B2;--ink-3:#85928B;--line:#2A3530;
  --accent:#55BB8E;--accent-ink:#06120C;--accent-soft:#163A2B;
  --amber:#E6A94B;--amber-soft:#3A2A10;--red:#EF7B71;--red-soft:#3C1916;--blue:#88AAE8;--blue-soft:#17243A;
  --xml-tag:#6FCB9F;--new-row:#15291F;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--sans);padding-inline:16px;padding-block:0 64px}
.wrap{max-width:1100px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:18px;font-weight:600}
h2{font-size:26px;font-weight:700;letter-spacing:-.01em}
h3{font-size:17px;font-weight:600}
p{margin:0}
.lead{font-size:16px;color:var(--ink-2);max-width:66ch}
.mono,code{font-family:var(--mono);font-size:13px}
.muted{color:var(--ink-3)}
.small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:14px;padding-block:16px 8px;flex-wrap:wrap}
.top h1{margin-right:auto}
.link{background:none;border:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding:4px}
.tariff-tag{font-size:12.5px;color:var(--ink-3)}

.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-block:8px 20px;padding:0;list-style:none}
.step{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--ink-3);text-align:left;width:100%}
.step .dot{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--sunk);color:var(--ink-3)}
.step .t{font-weight:600;font-size:14px;line-height:1.25;display:block}
.step .s{font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .txt{min-width:0}
.step[aria-current="step"]{border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 1px var(--accent)}
.step[aria-current="step"] .dot{background:var(--accent);color:var(--accent-ink)}
.step.done{color:var(--ink-2)}
.step.done .dot{background:var(--accent-soft);color:var(--accent)}
.step:disabled{cursor:default;opacity:.6}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:20px}
.section{display:grid;gap:12px}
.section + .section{border-top:1px solid var(--line);padding-top:20px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 20px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--ink-3)}
.btn.big{padding:15px 28px;font-size:17px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.sm{padding:6px 12px;font-size:13.5px;border-radius:8px}
.why{font-size:14px;color:var(--red);font-weight:500}

.drop{position:relative;border:2px dashed var(--line);border-radius:14px;padding:36px 20px;display:grid;place-items:center;gap:8px;text-align:center;background:var(--sunk)}
.drop.drag{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .big{font-size:19px;font-weight:600}
.drop .icon{width:54px;height:54px;border-radius:12px;display:grid;place-items:center;font-family:var(--mono);font-weight:500;font-size:13px;background:var(--surface);border:1px solid var(--line);color:var(--accent)}
.file{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);flex-wrap:wrap}
.file .icon{font-family:var(--mono);font-size:12px;font-weight:500;padding:4px 7px;border-radius:6px;background:var(--surface);color:var(--accent)}
.file .grow{flex:1;min-width:0}
.file label{position:relative}
.file label input{position:absolute;inset:0;opacity:0;cursor:pointer}

.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:var(--sunk);border-radius:10px;padding:10px 14px;min-width:120px}
.stat b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-3)}

/* issues and notes */
.issue{border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:10px;padding:12px 14px;display:grid;gap:8px;background:var(--surface)}
.issue.block{border-left-color:var(--red)}
.issue.ok{border-left-color:var(--accent);opacity:.8}
.issue .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.issue .h b{font-weight:600}
.issue .row,.note .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.issue input{padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);width:130px;font-family:var(--mono)}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag.block{background:var(--red-soft);color:var(--red)}
.tag.warn{background:var(--amber-soft);color:var(--amber)}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.info{background:var(--blue-soft);color:var(--blue)}
.tag.gray{background:var(--sunk);color:var(--ink-2)}
.note{padding:12px 14px;border-radius:10px;background:var(--blue-soft);display:grid;gap:6px}
.note.bad{background:var(--red-soft)}
.note.warn{background:var(--amber-soft)}
.note.good{background:var(--accent-soft)}

.viewer{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.viewer-bar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--sunk);border-bottom:1px solid var(--line);flex-wrap:wrap}
.viewer-bar .name{font-weight:600;font-size:14px;margin-right:auto}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.viewer-body{max-height:60vh;overflow:auto}
.sheet table{border-collapse:collapse;font-size:12.5px;width:max-content;min-width:100%}
.sheet td{border:1px solid var(--line);padding:4px 7px;white-space:pre-wrap;max-width:340px;vertical-align:top;font-variant-numeric:tabular-nums}
pre.xml{margin:0;padding:12px 14px;font:12px/1.5 var(--mono);white-space:pre}
pre.xml .t{color:var(--xml-tag)}
pre.xml mark{background:var(--new-row);color:inherit;display:block;margin-inline:-14px;padding-inline:11px;border-left:3px solid var(--accent)}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.facts div{background:var(--surface);padding:8px 12px;display:grid}
.facts span{font-size:12px;color:var(--ink-3)}
.facts b{font-weight:500;font-size:13.5px;white-space:pre-line}

.scroll{overflow-x:auto}
table.list{border-collapse:collapse;width:100%;font-size:13.5px}
table.list th,table.list td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.list th{font-size:12px;font-weight:600;color:var(--ink-3);background:var(--sunk);position:sticky;top:0;white-space:nowrap}
table.list td.n,table.list th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.list tr.new td{background:var(--new-row)}
table.list tr.bad td{background:var(--red-soft)}
table.list select{max-width:220px;padding:4px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}

.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choice{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:18px;display:grid;gap:6px}
.choice:hover{border-color:var(--ink-3)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice b{font-size:17px}
.choice span{color:var(--ink-2);font-size:14px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.opt:hover{border-color:var(--ink-3)}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}

.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 16px}
.field{display:grid;gap:4px;align-content:start}
.field.wide{grid-column:1/-1}
.field label{font-size:13.5px;font-weight:500;color:var(--ink-2)}
.field input,.field textarea,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.field input.code{font-family:var(--mono)}
.field textarea{min-height:60px;resize:vertical}
.field.missing input,.field.missing select,.field.missing textarea{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.field .src{font-size:12px;color:var(--ink-3)}
.req{color:var(--red)}

.pick{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.prow:last-child{border-bottom:0}
.prow .name{font-weight:600}
.prow .sub{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.prow .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.prow .more{grid-column:1/-1;display:grid;gap:14px;padding-top:10px}
.lines{font-size:13px;border-collapse:collapse;width:100%}
.lines td,.lines th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.lines th{font-size:12px;color:var(--ink-3);font-weight:600}
.lines td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.checks{display:grid;gap:8px}
.check{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.check .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px}
.check.pass .ic{background:var(--accent);color:var(--accent-ink)}
.check.fail{background:var(--red-soft)}
.check.fail .ic{background:var(--red);color:#fff}
.check .d{grid-column:2;font-size:13px;color:var(--ink-2)}
.signoff{border:2px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
.signoff label.chk{display:flex;gap:10px;align-items:flex-start}
.signoff input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin-top:2px}

.drawer{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;justify-content:flex-end;z-index:20}
.drawer .inner{background:var(--ground);width:min(640px,100%);height:100%;overflow:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start}
.tres{display:grid;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.tline{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:4px 12px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
.tline:last-child{border-bottom:0}
.tline .c{font-family:var(--mono);font-weight:500}
.tline .r{font-size:12px;color:var(--ink-3);grid-column:2/-1}
.tline.head{background:var(--sunk);font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}

@media (max-width:760px){
  .step{padding:8px;gap:6px}.step .s{display:none}.step .t{font-size:12.5px}.step .dot{width:24px;height:24px;font-size:13px}
  .choices{grid-template-columns:1fr}
  .card{padding:16px}
  h2{font-size:22px}
  .prow{grid-template-columns:minmax(0,1fr)}.prow .right{justify-content:flex-start}
  .tline{grid-template-columns:1fr}.tline .r{grid-column:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
(() => {
"use strict";
/* =====================================================================
   Accuracy rules this app follows
   1. Every value written to the XML comes from exactly one of: a cell in the
      Excel file, the official tariff (customs.erca.gov.et), the XML the person
      uploaded, a calculation shown to the person, or a decision the person made.
      Each value carries that source into the audit report.
   2. Nothing is guessed. When the Excel file is unclear, the person decides.
   3. Before download the file is re-read and checked against the Excel lines;
      any failed check blocks the download.
   ===================================================================== */

const T = window.TARIFF || null;
const S = {
  step: 1, pl: null, mode: null, xml: null,
  plView: "doc", xmlView: "easy", outView: "easy",
  colsConfirmed: false,
  res: {},             // issue id -> resolution {value?, ok:true}
  decl: {origin:"", pkgType:"", regime:"", addl:"", confirmed:false},
  hdr: {office:"", officeName:"", declarantCode:"", declarantName:"", refYear:String(new Date().getFullYear()), refNo:"", exporter:"", consigneeCode:"", consignee:"", rate:"", freight:"", insurance:"", other:""},
  match: {},           // xml item rank -> [line nos] confirmed as already declared
  matchAck: {},        // xml item rank -> "none" when the person says no lines correspond
  code: {},            // subheading(6) -> chosen 8-digit national code (for new lines)
  lineCode: {},        // line no -> national code override
  excluded: {},        // line no -> reason
  itemEdit: {},        // code -> {desc, addl, suppQty:[...], pkgs, licence, docs, prevDoc, freeText}
  pkgAck: false, dupAck: {},
  fixCode: {},         // xml item rank -> corrected code (only for codes missing from the tariff)
  open: null, lookup: null, signName: "", signOk: false,
};

/* ---------------- small helpers ---------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plural = (k, w, p) => `${k} ${k === 1 ? w : (p || w + "s")}`;
const hsFmt = c => c ? `${c.slice(0,4)}.${c.slice(4,6)}.${c.slice(6,8)}` : "";
const money = c => (c/100).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});    // cents -> text
const kg = g => (g/1000).toLocaleString("en-US", {maximumFractionDigits:3});                               // grams -> text
const kgX = g => { const s = (g/1000).toFixed(3); return s.endsWith("0") ? s.slice(0, -1) : s; }; // grams -> "1038.00" / "0.005": exact, at least 2 decimals
const f0 = x => Math.round(+x || 0).toLocaleString("en-US");
function toast(m){ const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3200); }
const colName = c => XLSX.utils.encode_col(c);
const cellRef = (r, c) => XLSX.utils.encode_cell({r, c});

/* integer maths only: money in cents, weight in grams */
function scaled(x, f){ const v = Math.round(x * f); return Math.abs(x * f - v) < 1e-6 ? v : null; }
// Split an integer total over weights so the parts add up to exactly the total (largest remainder).
function allocate(total, weights){
  const W = weights.reduce((s, w) => s + w, 0);
  const w = W > 0 ? weights : weights.map(() => 1), WW = W > 0 ? W : weights.length;
  const raw = w.map(x => total * x / WW), base = raw.map(Math.floor);
  let left = total - base.reduce((s, x) => s + x, 0);
  raw.map((x, i) => [x - base[i], i]).sort((a, b) => b[0] - a[0] || a[1] - b[1]).forEach(([, i]) => { if (left > 0) { base[i]++; left--; } });
  return base;
}

/* XML helpers: walk by tag name (tags like "A.I._code" break CSS selectors) */
function child(el, tag){ if (!el) return null; for (const c of el.children) if (c.tagName === tag) return c; return null; }
function at(el, path){ return path.split("/").reduce((e, t) => child(e, t), el); }
function tx(el, path){ const e = at(el, path); return e ? (e.textContent || "").trim() : ""; }
function setTx(el, path, v){
  let cur = el;
  for (const t of path.split("/")) { let c = child(cur, t); if (!c) { c = cur.ownerDocument.createElement(t); cur.appendChild(c); } cur = c; }
  cur.textContent = v == null ? "" : String(v);
}
function kids(el, tag){ return [...(el?.children || [])].filter(e => e.tagName === tag); }

/* ---------------- official tariff ---------------- */
const TAR = (() => {
  if (!T) return null;
  const by8 = new Map(), by6 = new Map(), byHead = new Map();
  for (const l of T.lines) {
    by8.set(l.c, l);
    const s6 = l.c.slice(0,6), h4 = l.c.slice(0,4);
    if (!by6.has(s6)) by6.set(s6, []); by6.get(s6).push(l);
    if (!byHead.has(h4)) byHead.set(h4, []); byHead.get(h4).push(l);
  }
  const list = k => new Map((T.lists?.[k] || []).map(x => [x.code, x.name]));
  return {by8, by6, byHead, units:list("unitOfMeasurment"), pkgs:list("typeOfPackage"), regimes:list("customsRegime"), addl:list("additionalCode"), countries:list("country")};
})();
const tline = c => TAR?.by8.get(c) || null;
const unitsOf = c => (tline(c)?.u || "").split(/[\s,/]+/).filter(Boolean);
const rateTxt = l => l ? `duty ${l.r.DR ?? "?"}% · VAT ${l.r.VAT ?? "?"}%${l.r.ER && l.r.ER !== "0" ? ` · excise ${l.r.ER}%` : ""}` : "";

/* ---------------- reading the Excel packing list ---------------- */
const FIELDS_PL = [
  ["no", "Line number", /^\s*(序号|No\.?)\s*/i, 1], ["ctn", "Carton number", /Ctn|箱号/i, 0], ["pkgs", "Number of packages", /PKGS|箱数/i, 1],
  ["desc", "Description", /Descr|品名/i, 1], ["hs", "HS code", /HS\s*CODE/i, 1], ["amount", "Amount (USD)", /AMOUNT|金额/i, 1],
  ["unit", "Unit", /单位|\bUnit\b(?!.*(N\.?\s*W|G\.?\s*W))/i, 0], ["qty", "Quantity", /Qty|数量/i, 1],
  ["nwUnit", "Net weight per unit", /单件净重|(?<!Total\s*)N\.?\s*W/i, 0], ["net", "Total net weight", /Total\s*N\.?\s*W|总净重/i, 1],
  ["gross", "Total gross weight", /G\.?\s*W|毛重/i, 1],
];
function readSheet(buf){
  const wb = XLSX.read(buf, {type:"array", cellNF:true});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const R = XLSX.utils.decode_range(ws["!ref"]);
  let hdr = -1;
  for (let r = R.s.r; r <= Math.min(R.e.r, R.s.r + 25) && hdr < 0; r++)
    for (let c = R.s.c; c <= R.e.c; c++) { const x = ws[cellRef(r,c)]; if (x && /HS\s*CODE/i.test(String(x.v))) { hdr = r; break; } }
  if (hdr < 0) throw new Error("This Excel file has no “HS CODE” column heading in its first sheet. Is it a packing list?");
  const heads = [];
  for (let c = R.s.c; c <= R.e.c; c++) { const x = ws[cellRef(hdr,c)]; heads.push({c, text: x ? String(x.v).replace(/\s+/g, " ").trim() : ""}); }
  const cols = {};
  // most specific first so "Total N.W." isn't taken as "N.W. per unit"
  for (const k of ["hs","net","gross","nwUnit","ctn","pkgs","desc","amount","qty","unit","no"]) {
    const def = FIELDS_PL.find(f => f[0] === k);
    const h = heads.find(h => h.text && def[2].test(h.text) && !Object.values(cols).includes(h.c));
    if (h) cols[k] = h.c;
  }
  return {wb, ws, R, hdr, heads, cols, sheetName: wb.SheetNames[0], sheetHtml: XLSX.utils.sheet_to_html(ws, {header:"", footer:""})};
}
function num(cell){
  // returns {v, kind}: kind "num" | "empty" | "textnum" (plain digits typed as text) | "comma" (decimal comma) | "bad"
  if (!cell || cell.v === "" || cell.v == null) return {v:null, kind:"empty"};
  if (typeof cell.v === "number") return {v:cell.v, kind:"num"};
  const s = String(cell.v).trim();
  if (s === "") return {v:null, kind:"empty"};
  if (/^-?\d+(\.\d+)?$/.test(s)) return {v:+s, kind:"textnum", raw:s};
  if (/^-?\d+,\d+$/.test(s)) return {v:+s.replace(",", "."), kind:"comma", raw:s};
  return {v:null, kind:"bad", raw:s};
}
function mergeOf(ws, r, c){ for (const m of ws["!merges"] || []) if (r >= m.s.r && r <= m.e.r && c >= m.s.c && c <= m.e.c) return m; return null; }
function parsePL(sheet){
  const {ws, R, hdr, cols} = sheet;
  const get = (r, k) => cols[k] == null ? null : ws[cellRef(r, cols[k])];
  const lines = [], ignored = [], issues = [];
  let totalRow = null;
  for (let r = hdr + 1; r <= R.e.r; r++) {
    const noCell = get(r, "no"), noV = noCell?.v;
    const rowText = []; for (let c = R.s.c; c <= R.e.c; c++) { const x = ws[cellRef(r,c)]; if (x && x.v !== "" && x.v != null) rowText.push(String(x.v)); }
    if (!rowText.length) continue;
    if (typeof noV !== "number") {
      if (/total|合计|总计/i.test(String(noV ?? rowText[0]))) { totalRow = r; break; }
      ignored.push({r, text: rowText.join(" | ").slice(0, 160)});
      continue;
    }
    const L = {no: noV, r, cells:{}, ctn: String(get(r, "ctn")?.v ?? (cols.ctn != null && mergeOf(ws, r, cols.ctn) ? ws[cellRef(mergeOf(ws, r, cols.ctn).s.r, cols.ctn)]?.v ?? "" : "")).trim()};
    for (const k of Object.keys(cols)) L.cells[k] = cellRef(r, cols[k]);
    // description: keep the English part exactly as written
    const raw = String(get(r, "desc")?.v ?? "");
    L.descRaw = raw;
    const cjk = /[　-鿿＀-￯]/;
    let en = raw;
    if (raw.includes("\n") && cjk.test(raw.split("\n")[0])) en = raw.slice(raw.indexOf("\n") + 1);
    else { const m = raw.match(/[　-鿿＀-￯]([^　-鿿＀-￯]*)$/); if (m && m[1].trim()) en = m[1]; }
    L.en = en.replace(/\s+/g, " ").trim();
    L.name = L.en.split(/[,;]/)[0].trim();
    if (!L.en) issues.push({id:`desc:${L.no}`, sev:"block", line:L.no, cell:L.cells.desc, kind:"text", msg:`Line ${L.no} has no English description.`, ask:"Type the description"});
    // HS code
    const hc = get(r, "hs");
    if (hc && hc.t === "n" && hc.v < 3e6 && ((hc.z && XLSX.SSF.is_date(hc.z)) || (hc.v >= 1e6 && Number.isInteger(hc.v)))) {
      const d = new Date(Date.UTC(1899, 11, 30) + Math.round(hc.v) * 864e5);
      L.hs = `${d.getUTCFullYear()}${String(d.getUTCMonth()+1).padStart(2,"0")}${String(d.getUTCDate()).padStart(2,"0")}`;
      issues.push({id:`hsdate:${L.no}`, sev:"block", line:L.no, cell:L.cells.hs, kind:"confirm",
        msg:`Excel stored the HS code of line ${L.no} (${esc(L.name)}) as a date: it shows ${esc(hc.w || "")}. Read as ${hsFmt(L.hs)}?`, yes:`Yes, it is ${hsFmt(L.hs)}`, ask:"Or type the code"});
    } else if (hc && typeof hc.v === "number") L.hs = String(Math.round(hc.v));
    else L.hs = hc ? String(hc.v).replace(/\D/g, "") : "";
    if (L.hs.length < 6) issues.push({id:`hs:${L.no}`, sev:"block", line:L.no, cell:L.cells.hs, kind:"text", msg:`Line ${L.no} (${esc(L.name)}) has no usable HS code (“${esc(hc?.w ?? hc?.v ?? "")}”).`, ask:"Type the HS code"});
    // numbers
    const numField = (k, label, factor, required) => {
      const c = get(r, k), p = num(c), ref = L.cells[k];
      if (p.kind === "empty") { if (required) issues.push({id:`${k}:${L.no}`, sev:"block", line:L.no, cell:ref, kind:"number", msg:`${label} is empty for line ${L.no} (${esc(L.name)}).`, ask:`Type the ${label.toLowerCase()}`, zero: k === "amount" ? "It is included in another line's price (0)" : null}); return null; }
      if (p.kind === "bad") { issues.push({id:`${k}:${L.no}`, sev:"block", line:L.no, cell:ref, kind:"number", msg:`${label} of line ${L.no} is “${esc(p.raw)}”, which is not a number.`, ask:`Type the ${label.toLowerCase()}`}); return null; }
      if (p.kind === "comma") issues.push({id:`${k}:${L.no}`, sev:"block", line:L.no, cell:ref, kind:"confirm", msg:`${label} of line ${L.no} is written “${esc(p.raw)}” with a comma.`, yes:`Yes, it means ${p.v}`, ask:"Or type the number", val:p.v});
      const s = scaled(p.v, factor);
      if (s == null) issues.push({id:`dec:${k}:${L.no}`, sev:"block", line:L.no, cell:ref, kind:"number", msg:`${label} of line ${L.no} is ${p.v}, which has more decimals than the XML can hold.`, ask:`Type the exact ${label.toLowerCase()}`});
      return s;
    };
    L.amount = numField("amount", "Price", 100, true);
    L.qty = cols.qty != null ? num(get(r, "qty")).v : null;
    if (L.qty != null && !Number.isInteger(L.qty)) issues.push({id:`qty:${L.no}`, sev:"warn", line:L.no, cell:L.cells.qty, kind:"ack", msg:`Quantity of line ${L.no} is ${L.qty}, not a whole number.`});
    L.unit = String(get(r, "unit")?.v ?? "").trim().toUpperCase();
    L.net = numField("net", "Total net weight", 1000, true);
    L.nwUnit = cols.nwUnit != null ? num(get(r, "nwUnit")).v : null;
    // gross weight and packages are written once per carton; merged cells tell which lines share them
    const gm = cols.gross != null ? mergeOf(ws, r, cols.gross) : null;
    L.gGroup = gm ? cellRef(gm.s.r, cols.gross) : cellRef(r, cols.gross);
    L.gTop = !gm || gm.s.r === r;
    L.grossTop = L.gTop ? numField("gross", "Gross weight", 1000, false) : null;
    const pm = cols.pkgs != null ? mergeOf(ws, r, cols.pkgs) : null;
    L.pTop = !pm || pm.s.r === r;
    const pv = L.pTop ? num(get(r, "pkgs")) : {v:null, kind:"empty"};
    L.pkgs = pv.v == null ? 0 : pv.v;
    if (pv.kind === "bad" || (pv.v != null && !Number.isInteger(pv.v))) issues.push({id:`pkgs:${L.no}`, sev:"block", line:L.no, cell:L.cells.pkgs, kind:"number", msg:`Number of packages for line ${L.no} is “${esc(pv.raw ?? pv.v)}”.`, ask:"Type the number of packages"});
    lines.push(L);
  }
  // lines whose gross cell is empty and not merged: the person says which carton they belong to
  for (const L of lines) if (L.gTop && L.grossTop == null && !issues.some(i => i.id === `gross:${L.no}` || i.id === `dec:gross:${L.no}`)) {
    const prev = lines[lines.indexOf(L) - 1], grp = lines.filter(x => x.gGroup === L.gGroup);
    const who = grp.length > 1 ? `Lines ${grp[0].no}–${grp[grp.length-1].no} share one merged gross weight cell (${L.gGroup}), and it is empty.` : `Line ${L.no} (${esc(L.name)}) has no gross weight, and its cell isn't merged with a carton above.`;
    issues.push({id:`gross:${L.no}`, sev:"block", line:L.no, cell:L.cells.gross, kind:"number", msg:who,
      ask: grp.length > 1 ? "Type their gross weight together (kg)" : "Type its gross weight (kg)", joinPrev: prev ? prev.no : null});
  }
  // duplicate line numbers
  const seen = new Set(); for (const L of lines) { if (seen.has(L.no)) issues.push({id:`dupno:${L.no}`, sev:"warn", line:L.no, kind:"ack", msg:`Line number ${L.no} appears twice in the Excel file. Both lines are used.`}); seen.add(L.no); }
  // supplier's own arithmetic
  const bad = lines.filter(L => L.qty != null && L.nwUnit != null && L.net != null && Math.abs(Math.round(L.qty * L.nwUnit * 1000) - L.net) > 1);
  if (bad.length) issues.push({id:"nwmath", sev:"warn", kind:"ack", msg:`In ${plural(bad.length, "line")}, Qty × N.W. per unit is not equal to Total N.W. (lines ${bad.slice(0,12).map(L => L.no).join(", ")}${bad.length > 12 ? "…" : ""}). The app uses the Total N.W. column exactly as written.`});
  if (ignored.length) issues.push({id:"ignored", sev:"warn", kind:"ack", msg:`${plural(ignored.length, "row")} between the heading and the Total row ${ignored.length===1?"has":"have"} no line number and ${ignored.length===1?"is":"are"} not used: ${ignored.slice(0,4).map(x => `row ${x.r+1} “${esc(x.text.slice(0,60))}”`).join("; ")}${ignored.length > 4 ? "…" : ""}`});
  // header text
  let top = "";
  for (let r = R.s.r; r < hdr; r++) for (let c = R.s.c; c <= R.e.c; c++) { const x = ws[cellRef(r,c)]; if (x && x.v) top += String(x.v) + "\n"; }
  const pick = re => { const m = top.match(re); return m ? m[1].trim() : ""; };
  const meta = {seller: pick(/Seller\s*[：:]\s*(.+?)(?:\n|\s{3,})/i), consignee: pick(/Consignee\s*[：:]\s*(.+?)(?:\n|\s{3,})/i),

      ${fileChip("pl", ".xlsx,.xls", P.file, `${esc(P.meta.seller || "Seller not found")}${P.meta.invoice ? " · invoice " + esc(P.meta.invoice) : ""} · sheet “${esc(sh.sheetName)}”`, "XLSX")}
      <div class="stats"><div class="stat"><b>${P.lines.length}</b><span>product lines</span></div><div class="stat"><b>${pk}</b><span>packages</span></div>

      <div class="viewer"><div class="viewer-bar"><span class="name">${esc(P.file)}</span>${seg("pl", S.plView, [["doc","As in Excel"],["list","As the app reads it"]])}</div><div class="viewer-body">${S.plView === "doc" ? `<div class="sheet">${sh.sheetHtml}</div>` : plTable()}</div></div>
    </div>
    <div class="section"><h3>1. Check that the app reads the right columns</h3>
      <p class="muted">The app found these columns in row ${sh.hdr + 1}. The last column shows the first product line, so you can see it's right.</p>
      <div class="scroll"><table class="list"><thead><tr><th>What</th><th>Column in your file</th><th>First line shows</th></tr></thead><tbody>${colRows}</tbody></table></div>
      ${missingReq.length ? `<div class="note bad">Choose a column for: ${missingReq.map(f => f[1]).join(", ")}.</div>` : ""}
      <div class="row" style="display:flex;gap:10px;align-items:center">${S.colsConfirmed ? `<span class="tag ok">Confirmed</span><button class="link" data-uncols="1">Change columns</button>` : `<button class="btn primary" data-cols="1" ${missingReq.length ? "disabled" : ""}>Yes, these columns are right</button>`}</div>
    </div>
    ${S.colsConfirmed ? `<div class="section"><h3>2. Answer the questions about this file</h3>
      <p class="muted">${P.issues.length ? `The app found ${plural(P.issues.length, "thing")} it can't decide by itself. Nothing here is guessed: every answer is written into the audit report.` : "The app found nothing unclear in this file."}</p>
      ${tc.length ? `<div class="note warn"><b>The Excel file's own Total row doesn't match its lines.</b><span>${tc.join("<br>")}</span><span>The app always uses the individual lines.</span></div>` : ""}
      ${blocks.map(issueCard).join("")}${warns.map(issueCard).join("")}
      ${groupIssues().map(x => `<div class="issue block"><div class="h"><span class="tag block">Fix the Excel file</span><span class="mono muted">cell ${x.g.key}</span></div><span>${x.msg} Correct the weight in the Excel file and upload it again; the app won't invent a weight.</span></div>`).join("")}
    </div>` : ""}
  </section>${nav(0, 2, "Next")}`;
}
function plTable(){
  const lg = lineGross();
  return `<table class="list"><thead><tr><th class="n">Line</th><th>Row</th><th>Product (English part)</th><th>HS code</th><th class="n">Qty</th><th>Unit</th><th class="n">Net kg</th><th class="n">Gross kg*</th><th class="n">Pkgs</th><th class="n">USD</th></tr></thead><tbody>
    ${S.pl.lines.map(L => { const a = lineVal(L, "amount"), n = lineVal(L, "net"), g = lg.get(L.no);
      return `<tr class="${openIssues().some(i => i.line === L.no) ? "bad" : ""}"><td class="n">${L.no}</td><td class="mono">${L.r + 1}</td><td>${esc(lineDesc(L))}</td><td class="mono">${hsFmt(lineHS(L).padEnd(8, "0"))}</td>
        <td class="n">${L.qty ?? ""}</td><td>${esc(L.unit)}</td><td class="n">${n == null ? "?" : kg(n)}</td><td class="n">${g ? kg(g.g) + (g.shared ? "*" : "") : ""}</td><td class="n">${L.pkgs || ""}</td><td class="n">${a == null ? "?" : money(a)}</td></tr>`; }).join("")}</tbody></table>
    <p class="muted small" style="padding:8px 12px">*Gross weight is written once per carton. When several lines share a carton, the carton's weight is shared by net weight; the shares add up to the carton weight exactly.</p>`;
}

/* ---- step 2 ---- */
function sel(id, map, value, label, note){
  const opts = [...map.entries()].sort((a,b) => a[0].localeCompare(b[0]));
  return `<div class="field ${value ? "" : "missing"}"><label for="${id}">${label} <span class="req">*</span></label><select id="${id}" data-decl="${id.replace("d-","")}" ${S.decl.confirmed ? "disabled" : ""}><option value="">Choose…</option>${opts.map(([c, n]) => `<option value="${esc(c)}" ${c === value ? "selected" : ""}>${esc(c)} — ${esc(n)}</option>`).join("")}</select>${note ? `<span class="src">${note}</span>` : ""}</div>`;
}
function screen2(){
  const choice = `<div class="choices">
    <button class="choice" data-mode="existing" aria-pressed="${S.mode==="existing"}"><b>Add to an XML file I already have</b><span>Use the XML exported from the customs portal. Lines already in it are matched and skipped.</span></button>
    <button class="choice" data-mode="new" aria-pressed="${S.mode==="new"}"><b>Start a new XML file</b><span>Make a fresh declaration from this Excel file.</span></button></div>`;
  let body = "";

    if (!S.xml) body = dropZone("xml", ".xml", "Drop the XML file here", "the file from “Export XML” on the customs portal", "XML");
    else {
      const x = S.xml, H = x.header;
      const facts = [["Customs office", `${H.office} ${H.officeName}`], ["Reference", H.ref], ["Consignee", H.consignee], ["Exporter", H.exporter], ["Exchange rate", `1 ${H.cur} = ${H.rate} ETB`], ["Invoice total", `${money(H.invC)} ${H.cur}`]];
      const badItems = x.filled.filter(i => !tline(i.hs));
      body = `${fileChip("xml", ".xml", x.file, `${plural(x.filled.length, "item")} already declared · ${esc(H.office)} · ref ${esc(H.ref)}`, "XML")}
        ${x.filled.filter(i => i.anomaly).map(i => `<div class="note bad"><b>Check item ${i.rank} (${esc(i.desc)}) in the portal.</b> Its freight is ${f0(i.frNat)} ETB on a ${money(i.usdC)} USD product, about ${i.anomaly} times its share. The app doesn't change existing items.</div>`).join("")}
        ${badItems.length ? `<div class="note bad"><b>${plural(badItems.length, "item")} in this XML ${badItems.length===1?"has an HS code":"have HS codes"} that ${badItems.length===1?"is":"are"} not in the official tariff:</b> ${badItems.map(i => `item ${i.rank} ${hsFmt(i.hs)} ${esc(i.desc)}`).join("; ")}. The portal will reject the file until ${badItems.length===1?"it is":"they are"} fixed; you can choose the right code in the next step.</div>` : ""}
        <div class="viewer"><div class="viewer-bar"><span class="name">${esc(x.file)}</span>${seg("xml", S.xmlView, [["easy","Easy view"],["raw","Raw XML"]])}</div><div class="viewer-body">
          ${S.xmlView === "easy" ? `<div class="facts">${facts.map(([k,v]) => `<div><span>${k}</span><b>${esc(v)}</b></div>`).join("")}</div>${xmlTable(x.filled.map(i => ({rank:i.rank, hs:i.hs, desc:i.desc, pkgs:i.pkgs, gross:i.gross, usd:i.usdC, bad:!tline(i.hs) || i.anomaly})))}` : `<pre class="xml">${hl(x.text)}</pre>`}</div></div>`;
    }
  } else if (S.mode === "new") {
    const h = S.hdr, fld = (k, label, hint, cls, req) => `<div class="field ${cls||""} ${req && !h[k] ? "missing" : ""}"><label for="h-${k}">${label}${req ? ' <span class="req">*</span>' : ""}</label><input id="h-${k}" data-hdr="${k}" value="${esc(h[k])}" ${hint?`placeholder="${esc(hint)}"`:""}></div>`;
    body = `<div class="fields">
        ${fld("rate", "Exchange rate: 1 USD = ? ETB", "the official rate for the declaration date", "", true)}
        ${fld("freight", "Freight total (USD)", "from the bill of lading")}${fld("insurance", "Insurance total (ETB)", "from the insurance certificate")}${fld("other", "Other costs total (USD)", "")}
        ${fld("exporter", "Exporter / seller", "", "wide")}${fld("consignee", "Consignee (importer) name", "", "wide")}
        ${fld("consigneeCode", "Consignee TIN", "")}${fld("declarantCode", "Declarant TIN", "")}${fld("declarantName", "Declarant name", "")}${fld("refNo", "Your reference number", "")}
        ${fld("office", "Customs office code", "e.g. AAK00")}${fld("officeName", "Customs office name", "")}
      </div><p class="muted small">Official exchange rates: <span class="mono">customs.erca.gov.et/trade/customs/rates/search</span></p>`;
  }
  let declBox = "";
  if (S.mode && (S.mode === "new" || S.xml)) {
    const ex = S.mode === "existing" ? S.xml.filled : [];
    const hint = (k, name) => { const m = majority(ex.map(i => i[k])); return m.length ? `Your XML uses ${m.map(([v, n]) => `${esc(v)} (${n} ${n===1?"item":"items"})`).join(", ")}` : ""; };
    declBox = `<div class="section"><h3>Details for the new items</h3>
      <p class="muted">These can't be read from the Excel file, so you choose them. They apply to every new item; you can change the national procedure for single items in the next step.</p>
      <div class="fields">
        ${sel("d-origin", TAR.countries, S.decl.origin, "Country of origin", hint("origin") || "From the certificate of origin")}
        ${sel("d-pkgType", TAR.pkgs, S.decl.pkgType, "Type of package", hint("pkgCode"))}
        ${sel("d-regime", TAR.regimes, S.decl.regime, "Customs procedure", hint("ext"))}
        ${sel("d-addl", TAR.addl, S.decl.addl, "National procedure (additional code)", hint("addl") + (hint("addl") ? ". " : "") + "421 is only for goods covered by a government exemption permit.")}
      </div>
      <div>${S.decl.confirmed ? `<span class="tag ok">Confirmed</span> <button class="link" data-undecl="1">Change</button>` : `<button class="btn primary" data-decl-ok="1" ${S.decl.origin && S.decl.pkgType && S.decl.regime && S.decl.addl ? "" : "disabled"}>These are correct</button>`}</div></div>`;
  }
  return `<section class="card"><div class="section"><h2>Where should the products go?</h2>${choice}${body}</div>${declBox}</section>${nav(1, 3, "Next")}`;
}
function xmlTable(rows){
  return `<table class="list"><thead><tr><th class="n">Item</th><th>HS code</th><th>Product</th><th class="n">Packages</th><th class="n">Gross kg</th><th class="n">USD</th></tr></thead><tbody>
    ${rows.map(i => `<tr class="${i.isNew?"new":""} ${i.bad?"bad":""}"><td class="n">${i.rank}</td><td class="mono">${hsFmt(i.hs)}${tline(i.hs) ? "" : ' <span class="tag block">not in tariff</span>'}</td><td>${esc(i.desc)}${i.isNew?' <span class="tag ok">new</span>':""}</td><td class="n">${i.pkgs}</td><td class="n">${kg(i.gross)}</td><td class="n">${money(i.usd)}</td></tr>`).join("")}</tbody></table>`;
}

/* ---- step 3 ---- */
function screen3(){
  const parts = [];
  // A. existing items: which Excel lines are they?
  if (S.mode === "existing") {
    const props = matchProposals(), decl = declaredLines();
    const confirmed = S.xml.filled.filter(i => S.match[i.rank]), none = S.xml.filled.filter(i => S.matchAck[i.rank]);
    const bad = S.xml.filled.filter(i => !tline(i.hs));
    parts.push(`<div class="section"><h3>A. Lines that are already in your XML</h3>
      <p class="muted">For each item already in the XML, confirm which Excel lines it covers. Those lines won't be added again.</p>
      <div class="stats"><div class="stat"><b>${confirmed.length} of ${S.xml.filled.length}</b><span>items matched</span></div><div class="stat"><b>${decl.size}</b><span>Excel lines covered</span></div></div>
      ${props.some(p => p.prop) ? `<div><button class="btn primary" data-matchall="1">Confirm all ${props.filter(p => p.prop).length} suggested matches</button></div>` : ""}
      ${props.map(p => `<div class="issue ${p.prop ? "" : "block"}"><div class="h"><span class="tag ${p.prop ? "warn" : "block"}">${p.prop ? "Suggested" : "No match found"}</span><b>Item ${p.it.rank}: ${esc(p.it.desc)}</b><span class="mono muted">${hsFmt(p.it.hs)} · ${money(p.it.usdC)} USD</span></div>
          ${p.prop ? `<span>Excel ${p.prop.length === 1 ? "line" : "lines"} ${p.prop.map(L => `<b>${L.no}</b> ${esc(lineName(L))} (${money(lineVal(L, "amount"))})`).join(", ")}: ${p.why}.</span>
            <div class="row"><button class="btn sm primary" data-match="${p.it.rank}" data-lines="${p.prop.map(L => L.no).join(",")}">Yes, these lines</button><button class="btn sm" data-pickfor="${p.it.rank}">Choose lines myself</button></div>`
          : `<span>No Excel lines with HS ${hsFmt(p.it.hs).slice(0,7)} add up to ${money(p.it.usdC)} USD.</span><div class="row"><button class="btn sm primary" data-pickfor="${p.it.rank}">Choose lines myself</button><button class="btn sm" data-nomatch="${p.it.rank}">This item is not in the Excel file</button></div>`}
          ${S.open === "pick:" + p.it.rank ? pickLines(p.it) : ""}</div>`).join("")}
      ${confirmed.length || none.length ? `<details><summary class="muted">Confirmed (${confirmed.length + none.length})</summary><div class="scroll"><table class="list"><tbody>${[...confirmed, ...none].map(i => `<tr><td class="n">${i.rank}</td><td>${esc(i.desc)}</td><td>${S.match[i.rank] ? `lines ${S.match[i.rank].join(", ")}` : "not in the Excel file"}</td><td><button class="link" data-unmatch="${i.rank}">Undo</button></td></tr>`).join("")}</tbody></table></div></details>` : ""}
      ${bad.map(i => { const opts = TAR.by6.get(i.hs.slice(0,6)) || [];
        return `<div class="issue block"><div class="h"><span class="tag block">Not in tariff</span><b>Item ${i.rank}: ${esc(i.desc)}</b></div><span>Its HS code ${hsFmt(i.hs)} is not in the official tariff, so the portal will refuse the file. Choose the correct code (only the HS code of this item changes):</span>
          ${opts.length ? opts.map(o => `<label class="opt ${S.fixCode[i.rank] === o.c ? "on" : ""}"><input type="radio" name="fix-${i.rank}" data-fix="${i.rank}" value="${o.c}" ${S.fixCode[i.rank] === o.c ? "checked" : ""}><span><b class="mono">${hsFmt(o.c)}</b> ${esc(o.d)} <span class="muted small">· ${rateTxt(o)}</span></span></label>`).join("") : `<span>No tariff lines under ${hsFmt(i.hs).slice(0,7)}. Use the HS code lookup, then fix it in the portal.</span>`}</div>`; }).join("")}
    </div>`);
  }
  // B. national codes
  const qs = codeQuestions();
  parts.push(`<div class="section"><h3>${S.mode === "existing" ? "B" : "A"}. Choose the Ethiopian HS code</h3>
    <p class="muted">Only the first 6 digits of an HS code are the same in every country. The supplier's last 2 digits are Chinese, so for each product the app shows the Ethiopian tariff lines under the same 6 digits. When there is only one, it is used automatically.</p>
    ${qs.length ? qs.map(q => codeQuestion(q)).join("") : `<div class="note good">Every product has exactly one matching Ethiopian tariff line.</div>`}
  </div>`);
  // C. items
  const B = buildItems(), items = B.items, noCode = newLines().filter(L => !chosenCode(L).code);
  const dupWithXml = S.mode === "existing" ? items.filter(it => S.xml.filled.some(i => i.hs === it.code) && !S.dupAck[it.code]) : [];
  parts.push(`<div class="section"><h3>${S.mode === "existing" ? "C" : "B"}. Check each new item</h3>
    <div class="stats"><div class="stat"><b>${items.length}</b><span>new items</span></div><div class="stat"><b>${items.filter(i => !i.problems.length).length}</b><span>complete</span></div>
      <div class="stat"><b>${money(items.reduce((s, i) => s + i.usd, 0))}</b><span>USD</span></div><div class="stat"><b>${noCode.length}</b><span>lines waiting for an HS code</span></div></div>
    ${B.moves.length ? `<div class="issue ${S.pkgAck ? "ok" : ""}"><div class="h"><span class="tag ${S.pkgAck ? "ok" : "warn"}">${S.pkgAck ? "Agreed" : "Please check"}</span><b>Package counts</b></div>
      <span>Every item needs at least 1 package, but ${plural(B.moves.length, "item")} ${B.moves.length===1?"has":"have"} no carton of ${B.moves.length===1?"its":"their"} own (${B.moves.length===1?"it shares":"they share"} a carton with another product). To keep the total at ${B.pkgTotal} packages, 1 package is moved: ${B.moves.map(m => `${hsFmt(m.from.code)} → ${hsFmt(m.to.code)}`).join(", ")}.</span>
      <div class="row">${S.pkgAck ? `<button class="link" data-pkgack="0">Change</button>` : `<button class="btn sm primary" data-pkgack="1">OK, use these counts</button><span class="muted small">Or type package counts in each item below.</span>`}</div></div>` : ""}
    ${dupWithXml.map(it => `<div class="issue"><div class="h"><span class="tag warn">Please check</span><b>${hsFmt(it.code)} is already used by an item in your XML</b></div><span>The new lines will be a second item with the same code. If they belong in the existing item, go back to part A and add them to it.</span><div class="row"><button class="btn sm primary" data-dupack="${it.code}">Keep as a separate item</button></div></div>`).join("")}
    <div class="pick">${items.map(it => itemRow(it)).join("")}</div>
  </div>`);
  return `<section class="card"><div><h2>Items</h2><p class="lead">Go through the parts in order. Anything marked red needs your answer.</p></div>${parts.join("")}</section>${nav(2, 4, "Check the file")}`;
}
function pickLines(it){
  const taken = declaredLines(), cur = new Set(S.picking || []);
  const pool = S.pl.lines.filter(L => (!taken.has(L.no) || taken.get(L.no) === it.rank) && !S.excluded[L.no]);
  const sum = pool.filter(L => cur.has(L.no)).reduce((s, L) => s + lineVal(L, "amount"), 0);
  return `<div class="scroll" style="max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px"><table class="lines"><tbody>${pool.map(L => `<tr><td><input type="checkbox" data-pickline="${L.no}" ${cur.has(L.no) ? "checked" : ""} aria-label="Line ${L.no}"></td><td>${L.no}</td><td>${esc(lineName(L))}</td><td class="mono">${hsFmt(lineHS(L).padEnd(8,"0"))}</td><td class="n">${money(lineVal(L, "amount"))}</td></tr>`).join("")}</tbody></table></div>
    <div class="row"><span>Selected: <b>${money(sum)}</b> of ${money(it.usdC)} USD ${sum === it.usdC ? '<span class="tag ok">exact</span>' : '<span class="tag block">different</span>'}</span>
      <button class="btn sm primary" data-pickdone="${it.rank}" ${cur.size ? "" : "disabled"}>Use ${plural(cur.size, "line")}</button><button class="btn sm" data-pickcancel="1">Cancel</button></div>
    ${sum !== it.usdC && cur.size ? `<span class="small" style="color:var(--amber)">The value differs from the XML. The XML item stays as it is; only these lines are marked as already declared.</span>` : ""}`;
}
function codeQuestion(q){
  const s6 = `${q.s6.slice(0,4)}.${q.s6.slice(4)}`, names = [...new Set(q.lines.map(lineName))].slice(0, 6).join(", ");
  if (!q.opts.length) return `<div class="issue block"><div class="h"><span class="tag block">Not in the Ethiopian tariff</span><b>${s6}</b><span class="muted">${plural(q.lines.length, "line")}: ${esc(names)}</span></div>
    <span>There is no Ethiopian tariff line starting with ${s6}. The supplier's HS code may be wrong. Find the right code with the lookup, then type it for these lines.</span>
    <div class="row"><button class="btn sm" data-lookup="${q.s6.slice(0,4)}">Look up ${q.s6.slice(0,4)}</button><input id="lc-${q.s6}" placeholder="8-digit code" style="width:130px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;font-family:var(--mono)"><button class="btn sm primary" data-setcode="${q.s6}">Use for these lines</button></div></div>`;
  return `<div class="issue ${S.code[q.s6] ? "ok" : "block"}"><div class="h"><span class="tag ${S.code[q.s6] ? "ok" : "block"}">${S.code[q.s6] ? "Chosen" : "Choose one"}</span><b>${s6}</b><span class="muted">${plural(q.lines.length, "line")}: ${esc(names)} · Excel says ${[...new Set(q.lines.map(L => hsFmt(lineHS(L).padEnd(8,"0"))))].join(", ")}</span></div>
    ${q.opts.map(o => `<label class="opt ${S.code[q.s6] === o.c ? "on" : ""}"><input type="radio" name="c-${q.s6}" data-code6="${q.s6}" value="${o.c}" ${S.code[q.s6] === o.c ? "checked" : ""}><span><b class="mono">${hsFmt(o.c)}</b> ${esc(o.d)}<br><span class="muted small">${o.u ? `unit ${esc(o.u)} · ` : ""}${rateTxt(o)}</span></span></label>`).join("")}
    <span class="muted small">Descriptions are the official tariff text. Some lines only make sense with their heading: use “HS code lookup” to see the whole heading.</span></div>`;
}
function itemRow(it){
  const open = S.open === it.code, E = S.itemEdit[it.code] || {};
  const pill = it.problems.length ? `<span class="tag block">${plural(it.problems.length, "thing")} to fix</span>` : `<span class="tag ok">Complete</span>`;
  return `<div class="prow"><div style="min-width:0"><div class="name">${esc(it.desc || "(no description)")}</div>
      <div class="sub"><span class="mono">${hsFmt(it.code)}</span> ${esc(it.t?.d || "")} · ${plural(it.lines.length, "line")} · ${plural(it.pkgs, "package")} · ${kg(it.gross)} kg · ${money(it.usd)} USD${it.units.length ? ` · ${it.units.map(u => `${u.code} ${u.qty ?? "?"}`).join(", ")}` : ""} · procedure ${esc(it.addl)}</div>
      ${it.problems.length && !open ? `<div class="small" style="color:var(--red)">${esc(it.problems[0])}</div>` : ""}</div>
    <div class="right">${pill}<button class="btn sm" data-open="${it.code}">${open ? "Close" : "Open"}</button></div>
    ${open ? `<div class="more">
      ${it.problems.map(p => `<div class="note bad">${esc(p)}</div>`).join("")}
      <div class="fields">
        <div class="field wide ${it.desc.trim() && it.desc.length <= 250 ? "" : "missing"}"><label for="e-desc">Description on the declaration (${it.desc.length}/250)</label><textarea id="e-desc" data-edit="desc">${esc(it.desc)}</textarea><span class="src">${esc(it.descSrc)}</span></div>
        ${it.units.map((u, i) => `<div class="field ${u.qty ? "" : "missing"}"><label for="e-u${i}">Quantity in ${esc(u.name || u.code)} <span class="req">*</span></label><input id="e-u${i}" data-unit="${i}" value="${esc(E.suppQty?.[i] ?? (u.auto ? u.qty : ""))}" placeholder="${u.auto ? "" : "Type it"}"><span class="src">Unit ${esc(u.code)} is required by the tariff. ${u.auto ? `Filled from ${esc(u.src)}.` : `Excel gives ${u.plUnits.map(esc).join(", ")}, which the app can't convert, so type it.`}</span></div>`).join("")}
        <div class="field"><label for="e-pkgs">Number of packages</label><input id="e-pkgs" data-edit="pkgs" value="${it.pkgs}"><span class="src">${esc(it.pkgsSrc)}</span></div>
        <div class="field"><label for="e-addl">National procedure</label><select id="e-addl" data-edit="addl">${[...TAR.addl.entries()].map(([c, n]) => `<option value="${esc(c)}" ${c === it.addl ? "selected" : ""}>${esc(c)} — ${esc(n.slice(0, 60))}</option>`).join("")}</select><span class="src">${esc(it.addlSrc)}</span></div>
        <div class="field"><label for="e-licence">Licence number</label><input id="e-licence" data-edit="licence" value="${esc(E.licence || "")}"></div>
        <div class="field"><label for="e-docs">Required documents</label><input id="e-docs" data-edit="docs" value="${esc(E.docs || "")}"></div>
      </div>
      <div class="note"><b>Official tariff: ${hsFmt(it.code)}</b><span>${esc(it.t?.d || "")} · ${it.t?.u ? "unit " + esc(it.t.u) + " · " : "no supplementary unit · "}${rateTxt(it.t)}</span>
        <span class="small">Gross weight: ${it.grossShared ? "shared from carton weights by net weight (some cartons hold other products too)" : "carton weights exactly as in Excel"}.</span></div>
      <div class="scroll"><table class="lines"><thead><tr><th>Line</th><th>Excel description</th><th>Excel HS</th><th class="n">Qty</th><th class="n">Net kg</th><th class="n">USD</th><th></th></tr></thead><tbody>
        ${it.lines.map(L => `<tr><td>${L.no}</td><td>${esc(lineDesc(L))}</td><td class="mono">${hsFmt(lineHS(L).padEnd(8,"0"))}</td><td class="n">${L.qty ?? ""} ${esc(L.unit)}</td><td class="n">${kg(lineVal(L, "net"))}</td><td class="n">${money(lineVal(L, "amount"))}</td>
          <td><select data-move="${L.no}" aria-label="Move line ${L.no}"><option value="">Keep here</option>${(TAR.by6.get(lineHS(L).slice(0,6)) || []).filter(o => o.c !== it.code).map(o => `<option value="${o.c}">Use ${hsFmt(o.c)} instead</option>`).join("")}<option value="__out">Leave out of the XML…</option></select></td></tr>`).join("")}
      </tbody></table></div>
      <div><button class="btn sm primary" data-open="${it.code}">Done</button> <button class="link" data-reset="${it.code}">Undo my changes to this item</button></div>
    </div>` : ""}</div>`;
}

/* ---- step 4 ---- */
function screen4(){
  const R = build(), checks = runChecks(R), allOk = checks.every(c => c.ok);
  const newR = new Set(R.out.map(o => o.rank));
  const rows = [...(S.mode === "existing" ? S.xml.filled.map(i => ({rank:i.rank, hs:S.fixCode[i.rank] || i.hs, desc:i.desc, pkgs:i.pkgs, gross:i.gross, usd:i.usdC})) : []),
    ...R.out.map(o => ({rank:o.rank, hs:o.it.code, desc:o.it.desc, pkgs:o.it.pkgs, gross:o.it.gross, usd:o.it.usd, isNew:1}))];
  let raw = "";
  if (S.outView === "raw") raw = R.xml.split(/(?=<Item>)/).map(p => { const m = p.match(/^<Item>\s*<Rank>(\d+)<\/Rank>/); if (m && newR.has(+m[1])) { const e = p.indexOf("</Item>") + 7; return `<mark>${hl(p.slice(0,e))}</mark>${hl(p.slice(e))}`; } return hl(p); }).join("");
  const canDl = allOk && S.signOk && S.signName.trim().length > 1;
  return `<section class="card">
    <div class="section"><h2>Check and download</h2>
      <p class="lead">The app has built the file and read it back. Every check below must pass before you can download.</p>
      <div class="checks">${checks.map(c => `<div class="check ${c.ok ? "pass" : "fail"}"><span class="ic">${c.ok ? "✓" : "✗"}</span><b>${esc(c.title)}</b><span class="d">${esc(c.detail || "")}</span></div>`).join("")}</div>
      ${allOk ? "" : `<div class="note bad">Go back to fix what is marked ✗. The download stays locked until every check passes.</div>`}
    </div>
    <div class="section"><div class="viewer"><div class="viewer-bar"><span class="name">${esc(outName(".xml"))}</span>${seg("out", S.outView, [["easy","Easy view"],["raw","Raw XML"]])}</div>
      <div class="viewer-body">${S.outView === "easy" ? xmlTable(rows) : `<pre class="xml">${raw}</pre>`}</div></div></div>
    <div class="section signoff">
      <h3>Your check</h3>
      <p class="muted">The app copies and adds up; it doesn't know the goods. Before using this file, compare the new items with the commercial invoice, packing list and certificate of origin, and check the HS classification. The person who submits the declaration is responsible for it.</p>
      <div class="field" style="max-width:360px"><label for="sign-name">Your full name</label><input id="sign-name" data-sign="name" value="${esc(S.signName)}"></div>
      <label class="chk"><input type="checkbox" data-sign="ok" ${S.signOk ? "checked" : ""}><span>I have checked the new items against the documents, and I understand that I am responsible for the declaration I submit.</span></label>
      <div class="row" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <button class="btn big primary" data-download="xml" ${canDl ? "" : "disabled"}>Download XML</button>
        <button class="btn big" data-download="audit" ${canDl ? "" : "disabled"}>Download audit report</button>
        ${canDl ? "" : `<span class="why">${allOk ? "Enter your name and tick the box." : "Some checks failed."}</span>`}
      </div>
      <p class="muted small">Keep the audit report with the declaration. It lists, for every value in the XML, the Excel cell, tariff line or decision it came from.</p>
    </div>
  </section>${nav(3, 0)}<div class="nav"><span></span><button class="link" data-restart="1">Start again with other files</button></div>`;
}

/* ---- HS lookup drawer ---- */
function renderLookup(){
  const D = $("drawer");
  if (S.lookup == null) { D.innerHTML = ""; return; }
  const q = S.lookup.trim(), digits = q.replace(/[\s.]/g, "");
  let res = [];
  if (T && q) {
    if (/^\d{2,}$/.test(digits)) res = T.lines.filter(l => l.c.startsWith(digits.slice(0, 8)));
    else { const w = q.toLowerCase().split(/\s+/).filter(Boolean); res = T.lines.filter(l => w.every(x => l.d.toLowerCase().includes(x))); }
  }
  const byHead = new Map(); for (const l of res.slice(0, 400)) { const h = l.c.slice(0,4); if (!byHead.has(h)) byHead.set(h, []); byHead.get(h).push(l); }
  D.innerHTML = `<div class="drawer" data-close="1"><div class="inner" role="dialog" aria-label="HS code lookup">
    <div style="display:flex;align-items:center;gap:10px"><h2 style="font-size:22px;margin-right:auto">HS code lookup</h2><button class="btn sm" data-close="1">Close</button></div>
    <p class="muted">The official Ethiopian customs tariff (${T ? T.count.toLocaleString() + " lines, downloaded " + T.fetched + " from customs.erca.gov.et" : "not loaded"}). Search by code (at least 2 digits) or by words.</p>
    <input id="lookup-q" value="${esc(q)}" placeholder="e.g. 8414 or compressor" style="padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--surface)" autofocus>
    ${q ? `<p class="muted small">${res.length.toLocaleString()} ${res.length === 1 ? "line" : "lines"}${res.length > 400 ? ", showing the first 400" : ""}</p>` : ""}
    ${[...byHead.entries()].map(([h, ls]) => `<div class="tres"><div class="tline head"><span class="c">${h}</span><span>${plural((TAR.byHead.get(h) || []).length, "line")} in this heading</span><button class="link" data-lookup="${h}">Show all</button></div>
      ${ls.map(l => `<div class="tline"><span class="c">${hsFmt(l.c)}</span><span>${esc(l.d)}</span><span class="muted small">${l.u ? esc(l.u) : ""}</span><span class="r">${rateTxt(l)}</span></div>`).join("")}</div>`).join("")}
  </div></div>`;
  const inp = $("lookup-q"); if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}

function render(){
  if (!T) { $("main").innerHTML = `<section class="card"><h2>The tariff file is missing</h2><p class="lead">Keep <span class="mono">tariff-data.js</span> in the same folder as this page. To create or refresh it, run <span class="mono">python3 tools/fetch_tariff.py</span>.</p></section>`; renderSteps(); return; }
  while (S.step > 1 && !ready(S.step)) S.step--;
  renderSteps();
  $("main").innerHTML = [0, screen1, screen2, screen3, screen4][S.step]();
  renderLookup();
  bindDrops();
}

/* ================= events ================= */
function bindDrops(){
  for (const [id, fn] of [["pl", f => f.arrayBuffer().then(b => loadPL(f.name, b))], ["xml", f => f.text().then(t => loadXML(f.name, t))]]) {
    const input = $("f-" + id); if (input) input.onchange = () => input.files[0] && fn(input.files[0]);
    const z = $("dz-" + id); if (!z) continue;
    z.ondragover = e => { e.preventDefault(); z.classList.add("drag"); };
    z.ondragleave = () => z.classList.remove("drag");
    z.ondrop = e => { e.preventDefault(); z.classList.remove("drag"); const f = e.dataTransfer.files[0]; if (f) fn(f); };
  }
}
function reparse(){ const p = parsePL(S.pl.sheet); Object.assign(S.pl, p); }
function resetAfterPL(){ Object.assign(S, {res:{}, match:{}, matchAck:{}, code:{}, lineCode:{}, excluded:{}, itemEdit:{}, pkgAck:false, dupAck:{}, fixCode:{}, open:null, colsConfirmed:false, signOk:false}); }
function loadPL(name, buf){
  try { const sheet = readSheet(buf); resetAfterPL(); S.pl = {file:name, sheet, ...parsePL(sheet)};
    if (!S.hdr.exporter) S.hdr.exporter = S.pl.meta.seller; if (!S.hdr.consignee) S.hdr.consignee = S.pl.meta.consignee; render(); }
  catch (e) { toast(e.message); }
}
function loadXML(name, text){ try { S.xml = {file:name, ...parseXML(text)}; Object.assign(S, {match:{}, matchAck:{}, fixCode:{}}); S.decl.confirmed = false; if (S.mode === "existing") prefillDecl(); render(); } catch (e) { toast(e.message); } }
function setRes(id, r){ S.res[id] = r; S.signOk = false; }

document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-close]"); if (!t) return;
  const d = t.dataset;
  if (d.close !== undefined) { if (e.target === t || t.tagName === "BUTTON") { S.lookup = null; render(); } return; }
  if (d.go) { const s = +d.go; if (s && ready(s)) { S.step = s; S.open = null; window.scrollTo({top:0}); render(); } return; }
  if (t.id === "open-lookup") { S.lookup = ""; return render(); }
  if (d.lookup) { S.lookup = d.lookup; return render(); }
  if (d.view) { const [k, v] = d.view.split(":"); S[k + "View"] = v; return render(); }
  // step 1
  if (d.cols) { S.colsConfirmed = true; reparse(); return render(); }
  if (d.uncols) { S.colsConfirmed = false; return render(); }
  if (d.ack) { setRes(d.ack, {ok:true}); return render(); }
  if (d.yes) { const i = S.pl.issues.find(x => x.id === d.yes); setRes(d.yes, i.val != null && i.val !== "" ? {value:i.val} : i.id.startsWith("hsdate") ? {value:S.pl.lines.find(L => L.no === i.line).hs} : {ok:true}); return render(); }
  if (d.set) {
    const i = S.pl.issues.find(x => x.id === d.set), v = ($("in-" + d.set)?.value || "").trim();
    if (!v) { toast("Type a value first"); return; }
    if (i.kind === "number" || i.kind === "confirm" && !i.id.startsWith("hsdate")) { const x = +v.replace(",", "."); if (!isFinite(x) || x < 0) { toast("That isn't a number"); return; } setRes(d.set, {value:x}); }
    else if (i.id.startsWith("hs")) { if (v.replace(/\D/g, "").length < 6) { toast("An HS code needs at least 6 digits"); return; } setRes(d.set, {value:v.replace(/\D/g, "")}); }
    else setRes(d.set, {value:v});
    return render();
  }
  if (d.zero) { setRes(d.zero, {value:0}); return render(); }
  if (d.join) { setRes(d.join, {join:+d.prev}); return render(); }
  if (d.undo) { delete S.res[d.undo]; return render(); }
  // step 2
  if (d.mode) { S.mode = d.mode; S.decl.confirmed = false; if (d.mode === "existing" && S.xml) prefillDecl(); return render(); }
  if (d.declOk) { S.decl.confirmed = true; return render(); }
  if (d.undecl) { S.decl.confirmed = false; return render(); }
  // step 3
  if (d.matchall) { for (const p of matchProposals()) if (p.prop && !Object.values(S.match).flat().some(no => p.prop.some(L => L.no === no))) S.match[p.it.rank] = p.prop.map(L => L.no); return render(); }
  if (d.match) { S.match[d.match] = d.lines.split(",").map(Number); return render(); }
  if (d.nomatch) { S.matchAck[d.nomatch] = "none"; return render(); }
  if (d.unmatch) { delete S.match[d.unmatch]; delete S.matchAck[d.unmatch]; return render(); }
  if (d.pickfor) { S.open = "pick:" + d.pickfor; S.picking = S.match[d.pickfor] ? [...S.match[d.pickfor]] : []; return render(); }
  if (d.pickcancel) { S.open = null; return render(); }
  if (d.pickdone) { S.match[d.pickdone] = [...S.picking]; S.open = null; return render(); }
  if (d.setcode) { const v = ($("lc-" + d.setcode)?.value || "").replace(/\D/g, ""); if (!tline(v)) { toast(`${v ? hsFmt(v) : "That"} is not in the official tariff`); return; }
    for (const L of newLines()) if (lineHS(L).slice(0,6) === d.setcode) S.lineCode[L.no] = v; return render(); }
  if (d.pkgack) { S.pkgAck = d.pkgack === "1"; return render(); }
  if (d.dupack) { S.dupAck[d.dupack] = true; return render(); }
  if (d.open) { S.open = S.open === d.open ? null : d.open; return render(); }
  if (d.reset) { delete S.itemEdit[d.reset]; return render(); }
  // step 4
  if (d.download) {
    const R = build(); if (!runChecks(R).every(c => c.ok) || !S.signOk) return;
    if (d.download === "xml") { download(outName(".xml"), R.xml, "application/xml"); toast(`Saved ${outName(".xml")}`); }
    else { download(outName("-audit.csv"), auditCSV(R), "text/csv"); toast("Saved the audit report"); }
    return;
  }
  if (d.restart) { S.pl = null; S.xml = null; S.mode = null; S.step = 1; S.decl = {origin:"", pkgType:"", regime:"", addl:"", confirmed:false}; resetAfterPL(); return render(); }
});
function prefillDecl(){
  // show what the XML uses, but the person still confirms
  const x = S.xml.filled, top = k => majority(x.map(i => i[k]))[0]?.[0] || "";
  if (!S.decl.origin) S.decl.origin = TAR.countries.has(top("origin")) ? top("origin") : "";
  if (!S.decl.pkgType) S.decl.pkgType = TAR.pkgs.has(top("pkgCode")) ? top("pkgCode") : "";
  if (!S.decl.regime) S.decl.regime = TAR.regimes.has(top("ext")) ? top("ext") : "";
}
document.addEventListener("change", e => {
  const t = e.target, d = t.dataset;
  if (d.col) { S.pl.sheet.cols[d.col] = t.value === "" ? undefined : +t.value; if (t.value === "") delete S.pl.sheet.cols[d.col]; reparse(); return render(); }
  if (d.decl) { S.decl[d.decl] = t.value; return render(); }
  if (d.hdr) { S.hdr[d.hdr] = t.value; return render(); }
  if (d.code6) { S.code[d.code6] = t.value; S.signOk = false; return render(); }
  if (d.fix) { S.fixCode[d.fix] = t.value; return render(); }
  if (d.pickline) { const no = +d.pickline, s = new Set(S.picking); t.checked ? s.add(no) : s.delete(no); S.picking = [...s]; return render(); }
  if (d.edit) { const E = (S.itemEdit[S.open] ||= {}); E[d.edit] = t.value; if (d.edit === "pkgs") { const v = +t.value; if (!Number.isInteger(v) || v < 1) { toast("Packages must be a whole number, at least 1"); delete E.pkgs; } } S.signOk = false; return render(); }
  if (d.unit) { const E = (S.itemEdit[S.open] ||= {}); (E.suppQty ||= [])[+d.unit] = t.value.trim(); S.signOk = false; return render(); }
  if (d.move) {
    const no = +d.move;
    if (t.value === "__out") return renderExcludeAsk(no);
    if (t.value) { S.lineCode[no] = t.value; toast(`Line ${no} now uses ${hsFmt(t.value)}`); S.open = t.value; }
    return render();
  }
  if (d.sign === "ok") { S.signOk = t.checked; return render(); }
});
function renderExcludeAsk(no){
  const L = S.pl.lines.find(x => x.no === no), host = document.querySelector(`[data-move="${no}"]`)?.closest("td");
  if (!host) return;
  host.innerHTML = `<div style="display:grid;gap:6px;min-width:220px"><input id="ex-reason" placeholder="Why is line ${no} left out?" style="padding:6px 8px;border:1px solid var(--line);border-radius:7px"><div><button class="btn sm primary" id="ex-ok">Leave out</button> <button class="btn sm" id="ex-cancel">Cancel</button></div></div>`;
  $("ex-ok").onclick = () => { const r = $("ex-reason").value.trim(); if (r.length < 3) { toast("Write a short reason; it goes into the audit report"); return; } S.excluded[no] = r; S.signOk = false; toast(`Line ${no} (${L.name}) left out`); render(); };
  $("ex-cancel").onclick = () => render();
}
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "lookup-q") { clearTimeout(renderLookup.t); const v = t.value; renderLookup.t = setTimeout(() => { S.lookup = v; renderLookup(); }, 180); }
  if (t.dataset.sign === "name") { S.signName = t.value; const ok = S.signOk && S.signName.trim().length > 1; document.querySelectorAll("[data-download]").forEach(b => { if (b.closest(".signoff")) b.disabled = !(ok && !document.querySelector(".check.fail")); }); }
  if (t.dataset.hdr) S.hdr[t.dataset.hdr] = t.value;
});
window.esadLoad = async (plUrl, xmlUrl) => {   // for testing: load files served next to the page
  if (plUrl) loadPL(decodeURIComponent(plUrl.split("/").pop()), await (await fetch(plUrl)).arrayBuffer());
  if (xmlUrl) { S.mode = "existing"; loadXML(decodeURIComponent(xmlUrl.split("/").pop()), await (await fetch(xmlUrl)).text()); prefillDecl(); render(); }
};
window.esadState = () => S;
render();
})();
</script>
</body>
</html>
